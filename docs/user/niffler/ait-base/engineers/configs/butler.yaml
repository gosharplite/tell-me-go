MODE: "butler"
PERSON: "You are an AI assistant. Please respond concisely and accurately in English."

SELECTED_PROVIDER: "deepseek-flash"

PROVIDERS:
  kimi:
    TYPE: "kimi"
    MODEL: "kimi-k3"
    URL: "https://api.moonshot.ai/v1"
    API_KEY: "${MOONSHOT_API_KEY}"
    MAX_TOKENS: 32768
    HEADERS:
      reasoning_effort: "max"
  deepseek-flash:
    TYPE: "deepseek"
    MODEL: "deepseek-v4-flash"
    URL: "https://api.deepseek.com"
    API_KEY: "${DEEPSEEK_API_KEY}"
    MAX_TOKENS: 32768
  deepseek-pro:
    TYPE: "deepseek"
    MODEL: "deepseek-v4-pro"
    URL: "https://api.deepseek.com"
    API_KEY: "${DEEPSEEK_API_KEY}"
    MAX_TOKENS: 32768
  vertex-flash:
    TYPE: "gemini"
    MODEL: "gemini-3-flash-preview"
    URL: "https://aiplatform.googleapis.com/v1/projects/YOUR_GCP_PROJECT_ID/locations/global/publishers/google/models"
    API_KEY: "${NIFFLER_HOME}/secrets/key.json"
    THINKING_BUDGET: 32768
    THINKING_LEVEL: "HIGH"
    MAX_TOKENS: 40960
  vertex-flash-3.6:
    TYPE: "gemini"
    MODEL: "gemini-3.6-flash"
    URL: "https://aiplatform.googleapis.com/v1/projects/YOUR_GCP_PROJECT_ID/locations/global/publishers/google/models"
    API_KEY: "${NIFFLER_HOME}/secrets/key.json"
    THINKING_BUDGET: 32768
    THINKING_LEVEL: "HIGH"
    MAX_TOKENS: 40960
  vertex-flash-lite:
    TYPE: "gemini"
    MODEL: "gemini-3.5-flash-lite"
    URL: "https://aiplatform.googleapis.com/v1/projects/YOUR_GCP_PROJECT_ID/locations/global/publishers/google/models"
    API_KEY: "${NIFFLER_HOME}/secrets/key.json"
    THINKING_BUDGET: 32768
    THINKING_LEVEL: "HIGH"
    MAX_TOKENS: 40960
  vertex-pro:
    TYPE: "gemini"
    MODEL: "gemini-3.1-pro-preview"
    URL: "https://aiplatform.googleapis.com/v1/projects/YOUR_GCP_PROJECT_ID/locations/global/publishers/google/models"
    API_KEY: "${NIFFLER_HOME}/secrets/key.json"
    THINKING_BUDGET: 32768
    THINKING_LEVEL: "HIGH"
    MAX_TOKENS: 40960
  vertex-claude:
    TYPE: "anthropic"
    MODEL: "claude-opus-4-8"
    URL: "https://aiplatform.googleapis.com/v1/projects/YOUR_GCP_PROJECT_ID/locations/global/publishers/anthropic/models"
    API_KEY: "${NIFFLER_HOME}/secrets/key.json"
    THINKING_BUDGET: 32768
  vertex-claude-fable:
    TYPE: "anthropic"
    MODEL: "claude-fable-5"
    URL: "https://aiplatform.googleapis.com/v1/projects/YOUR_GCP_PROJECT_ID/locations/global/publishers/anthropic/models"
    API_KEY: "${NIFFLER_HOME}/secrets/key.json"
    THINKING_BUDGET: 32768
  openai:
    TYPE: "openai"
    MODEL: "gpt-5.5"
    URL: "https://api.openai.com/v1"
    API_KEY: "${OPENAI_API_KEY}"
    HEADERS:
      reasoning_effort: "high"
  claude:
    TYPE: "anthropic"
    MODEL: "claude-opus-4-8"
    URL: "https://api.anthropic.com/v1"
    API_KEY: "${ANTHROPIC_API_KEY}"
    THINKING_BUDGET: 32768

# --- Tools & Features ---
USE_SEARCH: false
SHOW_THOUGHTS: false
SHOW_TOOLS: true

# --- Global Timeouts & Streaming ---
HTTP_TIMEOUT: 300

# --- Concurrent Execution ---
MAX_CONCURRENT_TOOLS: 5
TOOL_TIMEOUT: 300

# --- Safety & History ---
MAX_TURNS: 1000
MAX_HISTORY_TOKENS: 1000000
BYPASS_CONFIRMATION: true

