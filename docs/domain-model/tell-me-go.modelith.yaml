# yaml-language-server: $schema=https://modelith.sh/schema/domain-model/v1.json
kind: DomainModel
version: v1
title: tell-me-go — Multi-Provider Reasoning Agent
description: >
  A high-performance CLI assistant that unifies reasoning engines (Gemini,
  OpenAI, DeepSeek, Claude, Kimi) under a single interface. Models the core
  conversation loop, provider abstraction, tool execution, security
  boundaries, and cost auditing.

glossary:
  Orchestrator: >
    The top-level loop that drives a `Session`: receives a user prompt, delegates
    to the active `Provider`, dispatches `Tool` calls, and manages the `Turn`
    lifecycle.
  SecurityManager: >
    The component that validates `Tool` requests against the `SafePath` registry
    and delegates to the `UserInteractor` when user confirmation is required.
  Thought: >
    A provider-agnostic reasoning block emitted by an LLM — may be a text
    response, a tool-call request, or (for reasoning models) a chain-of-thought
    segment. Normalised from provider-specific wire formats.
  Chatter: >
    The conversation interface between the `Orchestrator` and the `Provider`
    gateway. Defines how prompts are sent, responses are streamed, and chat
    sessions are configured. Not an entity — it is a behavioral role with no
    persisted state, analogous to `Orchestrator` and `SecurityManager`.
  UserInteractor: >
    The interface through which the `SecurityManager` prompts the user for
    confirmation (e.g. before a `Tool` accesses an unauthorized path).
    Implementations include the interactive TUI
    capturer and a no-op variant for automated workflows. Prompt suppression is
    controlled by `Config.bypassConfirmation`.
  TellMeHome: >
    The filesystem root directory for all tell-me-go state — `Config`s, local
    `Skill`s, `History`, `SafePath`s, and `Task`s. A `Session`'s `History` can
    be archived (`--new`) without affecting `SafePath`s or `Task`s because they
    are stored under `TellMeHome`, not inside the `Session`-scoped `History`
    file. The environment tools (Niffler, Dobby, etc.) manage this directory;
    tell-me-go treats it as the stable namespace for everything it persists.

  CoverageSummary: >
    The tools-layer view of a coverage run, returned by the Go toolchain
    runner: the passed-test count, whether the package has no Go files,
    the coverage percentage, and the summary output. It is the
    consumer-facing projection of the infrastructure-internal coverage
    report, which stays infrastructure-internal by design (ADR-060).
    Not an entity — a value type with no relationships or lifecycle.

enums:
  APIFamily:
    description: >
      The wire-protocol family backing an LLM `Provider`. There are exactly
      three families — this is the compile-time-safe dispatch dimension
      (distinct from the user-facing `Provider.type` label string, which
      may include OpenAI-compatible providers like "deepseek" or "kimi").
    values:
      - name: openai
        definition: OpenAI-compatible API (covers openai, deepseek, kimi, and any future provider speaking the OpenAI protocol).
      - name: anthropic
        definition: Anthropic Messages API.
      - name: gemini
        definition: Google Gemini / Vertex AI API (covers google, gemini, vertex).

  LLMError:
    description: >
      Categories of `Provider` error that affect retry and failover behaviour.
      Distinguishing these lets the `Orchestrator` decide whether to retry the
      same `Provider`, switch to a fallback, or surface the error to the user.
    values:
      - name: rate_limited
        definition: The `Provider`'s quota has been exceeded; retry after backoff.
      - name: context_overflow
        definition: The accumulated prompt exceeds the model's context window.
      - name: auth_failure
        definition: The API key or credentials are invalid — no retry.
      - name: server_error
        definition: A transient 5xx from the `Provider`; may succeed on retry or failover.
      - name: timeout
        definition: The `Provider` did not respond within `Config.httpTimeout`.

entities:
  Session:
    definition: >
      A long-running conversation context identified by a unique ID. Owns a
      sequence of `Turn`s, a `History` for persistence, and the active `Config`.
      Managed by the `Orchestrator`.
    relationships:
      - entity: Turn
        cardinality: "1:n"
        ownership: owned
      - entity: Config
        cardinality: "n:1"
        ownership: referenced
        note: The `Config` active when the `Session` was created.
      - entity: Provider
        cardinality: "n:1"
        ownership: referenced
        note: The selected `Provider` for this `Session` (from `Config.PROVIDERS`).
      - entity: History
        cardinality: "1:1"
        ownership: owned
        note: Persisted record of this `Session`'s `Turn`s.
      - entity: Context
        cardinality: "1:1"
        ownership: owned
        note: The in-flight prompt payload assembled before each `Turn`.
      - entity: Task
        cardinality: "1:n"
        ownership: owned
        note: User-facing to-do items persisted alongside `History`.
    attributes:
      - name: id
        type: string
        description: UUID assigned at creation.
      - name: startTime
        type: timestamp
        description: When the `Session` was created (Go field `StartTime`).
      - name: turnCount
        type: integer
        derived: true
        derivation: Number of `Turn`s in this `Session`, derivable from `History.GetTotalEntries()` (2 messages per `Turn`) — not stored.
      - name: totalCost
        type: decimal
        derived: true
        derivation: Sum of all `Turn` costs in USD, accumulated on the session cost tracker; not a field on the Go `Session` struct.
    actions:
      - name: start
        actor: Orchestrator
        description: Create a new `Session` with the resolved `Config` and `Provider`.
      - name: archive
        actor: Orchestrator
        description: Archive the `Session`'s `History` and start a fresh one.
      - name: undo
        actor: Orchestrator
        description: Remove the last N `Turn`s and persist the change.
    invariants:
      - id: session-max-turns
        statement: >
          The `Session`'s working history is bounded: `Context` retains at most
          `Config.maxHistoryTurns` `Turn`s (0 = unlimited) within
          `Config.maxHistoryTokens` tokens.

  Context:
    definition: >
      The in-flight prompt payload assembled by the `Orchestrator` before each
      `Turn`. Distinct from `History` (persisted) — `Context` is the runtime
      view: it holds the system prompt, injected `Skill` content, the recent
      `Turn` history (possibly summarised), and the current user prompt. Its
      token count is checked against `Pricing.contextWindow` before every
      `Turn`. In the code, `Context` is implemented as a package of cooperating
      types (`internal/agent/session/context/`) rather than a single struct.
      Each type has a single responsibility in the assembly pipeline:
      HistoryPruner removes old turns, TokenGatekeeper enforces the token
      budget, `pinningPolicy` protects pinned turns, `emptyTurnFilter` removes
      empty turns, `finalContextValidator` validates the final state,
      TransientMerger merges transient content, WarningInjector emits
      token-pressure warnings, HistoryRepairer repairs malformed sequences,
      and the sanitizing transformers (contentCleaner, toolResponseCleaner,
      emptyMessagePruner, thoughtSignaturePropagator) clean the parts.
      Pruning policies (SlidingWindowPolicy, importanceRankPolicy,
      compositePruningPolicy) select candidate blocks, and Strategy
      orchestrates the pipeline. This decomposition is intentional — it keeps
      each concern testable in isolation.
    attributes:
      - name: tokenCount
        type: integer
        derived: true
        derivation: Total tokens in the assembled payload.
      - name: summarisedTurnCount
        type: integer
        derived: true
        derivation: Number of `Turn`s that have been summarised into this `Context`.
      - name: pinnedTurnIDs
        type: "[]string"
        description: >
          Stable UUIDs of `Turn`s protected from summarisation. Pin state is
          carried on each turn's `Content` (`Pinned`) and managed via
          `HistoryManager.SetPinned`.
    actions:
      - name: assemble
        actor: Orchestrator
        description: >
          Build the payload: system prompt + injected `Skill`s + recent `Turn`s
          (summarised or verbatim) + current user prompt.
      - name: inject_skill
        actor: Orchestrator
        description: Insert a matched `Skill`'s content into the system prompt.
      - name: summarise
        actor: Orchestrator
        description: >
          Compress older, non-pinned `Turn`s to keep token count within budget.
    invariants:
      - id: context-within-budget
        statement: "`tokenCount` must not exceed the model's `Pricing.contextWindow`."
      - id: context-pinned-preserved
        statement: "Pinned `Turn`s are never summarised — they are always included verbatim."

  Turn:
    definition: >
      One atomic exchange: a user prompt, zero or more assistant `Thought`s
      (possibly interleaved with `Tool` executions), and a final response.
      Every `Turn` belongs to exactly one `Session`. In the code, `Turn` also
      serves as the `Orchestrator`'s unit of execution — it carries runtime
      dependencies (gateway, executor, event bus) needed to process the turn.
      This hybrid nature is intentional: separating "what a Turn is" from
      "how a Turn runs" would add indirection without clear benefit.

      `Turn` is both a domain entity and an application-layer execution
      context. The domain fields (`prompt`, `thoughts`, `tokenCount`,
      `cost`) are declared below; runtime fields (gateway, executor,
      registry, token counter, event bus, cost tracker, context manager,
      clock, logger) are carried on the struct at
      `internal/agent/orchestrator/engine.go`. Hallucination-loop
      detection hashes the sanitized final response (SHA-256)
      transiently inside the loop detector — the hash is never stored on
      the `Turn`.
    relationships:
      - entity: ToolCall
        cardinality: "1:n"
        ownership: owned
        note: "`Tool` invocations requested during this `Turn`."
    attributes:
      - name: prompt
        type: string
        description: >
          The user's input text. Carried in `History` as the `Turn`'s user
          `Content`; not a field on the Go `Turn` struct.
      - name: thoughts
        type: "[]Thought"
        description: >
          The sequence of provider-agnostic reasoning blocks. Realized as
          `llm.Content` parts on the `Turn`'s response state (`Text` /
          `IsThought` / `FunctionCall`); not a `[]Thought` field on the Go
          `Turn` struct.
      - name: tokenCount
        type: integer
        derived: true
        derivation: Total tokens consumed (input + output + thinking).
      - name: cost
        type: decimal
        derived: true
        derivation: USD cost computed from token counts and `Provider` pricing.
    invariants:
      - id: turn-belongs-to-one-session
        statement: "A `Turn` belongs to exactly one `Session`."
      - id: turn-max-tool-iterations
        statement: "Tool-execution iterations within a single `Turn` must not exceed `Config.maxToolTurns`."

  ToolCall:
    definition: >
      A single invocation of a `Tool` requested by the LLM during a `Turn`. Carries
      the tool name, arguments, result, and timing. `ToolCall`s may execute
      concurrently (up to `Config.maxConcurrentTools`).
    attributes:
      - name: toolName
        type: string
      - name: arguments
        type: object
      - name: result
        type: object
        description: The tool's outcome — a `ToolResult` with `Text`, optional `BinaryData`/`Error`, and `Metadata`.
      - name: duration
        type: duration
      - name: status
        type: string
        description: success, error, or timeout.
    invariants:
      - id: tool-timeout
        statement: "Execution duration must not exceed `Config.toolTimeout` seconds."
      - id: tool-max-concurrent
        statement: "At most `Config.maxConcurrentTools` `ToolCall`s may execute simultaneously within a single `Turn`."

  Provider:
    definition: >
      An LLM backend reachable via a specific API. Encapsulates the type
      (gemini/openai/deepseek/anthropic/kimi), model name, endpoint URL,
      authentication, and provider-specific settings like thinking budget
      and the DeepSeek/Kimi thinking-mode toggle.
    attributes:
      - name: name
        type: string
        description: >
          The registry key identifying this `Provider` (e.g. "vertex-flash", "deepseek-pro").
          Note: In Go, this is the map key in `Config.Providers`, not a field on the `LLMProvider` struct.
          It is listed here because it is the `Provider`'s primary identity in the domain.
      - name: type
        type: string
        description: >
          The user-facing label identifying this `Provider` (e.g. "vertex-flash",
          "deepseek-pro", "kimi"). This is a free-form string, not an enum —
          multiple labels map to the same `APIFamily`. The `family` attribute
          (derived) resolves this label to a wire-protocol family.
      - name: family
        type: APIFamily
        derived: true
        derivation: >
          Resolved from `type` via LLMProvider.Family() — "openai"/"deepseek"/"kimi"
          → openai, "anthropic" → anthropic, "google"/"gemini"/"" → gemini.
      - name: model
        type: string
        description: The model identifier sent on the wire.
      - name: url
        type: string
        description: Base API endpoint.
      - name: maxTokens
        type: integer
      - name: thinkingBudget
        type: integer
        description: Max thinking tokens for reasoning models (0 = disabled).
      - name: thinkingLevel
        type: string
        description: Provider-specific reasoning effort (e.g. "HIGH").
      - name: thinkingEnabled
        type: boolean
        description: >
          Tri-state DeepSeek/Kimi thinking-mode toggle: nil = omit the field
          from the wire (preserve the provider default); true = thinking
          enabled; false = disabled. Only emitted for providers with the
          thinking-toggle capability. Distinct from `thinkingBudget` (token
          budget) and `thinkingLevel` (reasoning effort).
      - name: userID
        type: string
        description: >
          DeepSeek `user_id` for content safety, KVCache, and scheduling
          isolation. Emitted only when non-empty for providers with the
          thinking-toggle capability.
      - name: lastError
        type: LLMError
        description: >
          The most recent error returned by this `Provider` during the current
          `Turn`, if any. Used by the `Orchestrator` to decide retry vs.
          failover. Note: Runtime-only — carried on the `Turn`'s state
          (`TurnState.LastError`), not keyed per provider and not stored on the
          `LLMProvider` struct. Resets on restart.
    invariants:
      - id: provider-unique-name
        statement: "Each `Provider` in the registry has a unique name."

  Config:
    definition: >
      The YAML configuration loaded at startup. Defines the active `Provider`,
      the full `Provider` registry, tool enablement flags, safety limits, and
      per-model `Pricing` overrides.
    relationships:
      - entity: Pricing
        cardinality: "1:n"
        ownership: owned
        note: >
          Per-model cost rates from the built-in pricing table, overridable per
          model via the MODELS section. Realized in code as `Config.Models`
          (`map[string]ModelConfig`, each entry embedding `pricing.ModelPricing`).
      - entity: MCPServer
        cardinality: "1:n"
        ownership: owned
        note: >
          Configured external MCP servers (YAML key MCP_SERVERS). Realized in
          code as Config.MCPServers (map[string]MCPServerConfig).
    attributes:
      - name: selectedProvider
        type: string
        description: Key of the active `Provider` in the registry.
      - name: maxToolTurns
        type: integer
        description: >
          Recursion limit on tool-execution iterations within a single `Turn`
          (YAML key `MAX_TURNS`). Bounds the Think → Act → Observe cycle; it
          does not cap the number of user `Turn`s in a `Session`.
      - name: maxHistoryTurns
        type: integer
        description: >
          Turn-window pruning limit for `Context` assembly — at most this many
          `Turn`s are retained verbatim (0 = turn-based pruning disabled).
          Together with `maxHistoryTokens` this bounds the `Session`'s working
          history.
      - name: maxHistoryTokens
        type: integer
        description: Token budget for the retained `Context`; exceeding it triggers summarisation/pruning.
      - name: contextWindow
        type: integer
        derived: true
        derivation: >
          Effective token limit for the active model, resolved from
          `maxHistoryTokens`, per-model Models overrides, and
          `Pricing.contextWindow`.
      - name: maxConcurrentTools
        type: integer
        description: Maximum `ToolCall`s that may execute simultaneously within a single `Turn`.
      - name: toolTimeout
        type: integer
        description: Per-`ToolCall` execution timeout in seconds.
      - name: httpTimeout
        type: integer
        description: "`Provider` request timeout in seconds."
      - name: useSearch
        type: boolean
        description: Enables Google Search grounding for Gemini `Provider`s (priced via `Pricing.searchQuery`).
      - name: failoverOrder
        type: "[]string"
        description: Ordered `Provider` registry keys for the gateway's failover chain.
      - name: useTUIPrompt
        type: boolean
        description: Use the interactive TUI prompt (with suggestions) instead of the plain capturer.
      - name: showThoughts
        type: boolean
      - name: showTools
        type: boolean
      - name: bypassConfirmation
        type: boolean
        description: When true, all security prompts are skipped (used in CI/automation).
    invariants:
      - id: config-valid-provider
        statement: "`selectedProvider` must reference a key in the PROVIDERS registry."
      - id: bypass-suppresses-prompts
        statement: >
          When `Config.bypassConfirmation` is true, Confirm is never called —
          every authorization check is silently approved.

  Pricing:
    definition: >
      The cost structure for a specific model variant. Maps a model identifier
      to per-million-token rates for cached hits, cache misses, and completion
      tokens. Owned by `Config`; `Turn` cost is computed by looking up the
      active `Provider`'s model in this table.
    attributes:
      - name: modelName
        type: string
        description: >
          The model identifier this pricing applies to. Note: In Go, this is
          the map key in `PricingData.Models`, not a field on the
          `ModelPricing` struct.
      - name: contextWindow
        type: integer
        description: Maximum token capacity for this model.
      - name: hitRate
        type: decimal
        description: USD per million cached input tokens.
      - name: missRate
        type: decimal
        description: USD per million uncached input tokens.
      - name: compRate
        type: decimal
        description: USD per million output (completion) tokens.
      - name: thinkingBudget
        type: integer
        description: Default thinking token budget for reasoning models (0 = disabled). Overridden by provider-level THINKING_BUDGET.
      - name: searchQuery
        type: decimal
        description: USD per search query (Google Search grounding). Applies to Gemini models with search enabled.
    invariants:
      - id: pricing-unique-model
        statement: "Each `modelName` appears at most once in the pricing table."

  Tool:
    definition: >
      A capability exposed to the LLM for agentic execution. `Tool`s are
      registered at startup and carry a JSON Schema describing their
      parameters. Categories include workspace (files, git), analysis
      (AST, architecture), integrations (Jira, ADO, Teams), and system
      (shell, testing). Analysis tools return a `CoverageSummary` of a
      coverage run.
    attributes:
      - name: name
        type: string
        description: Unique tool identifier (e.g. "execute_command").
      - name: description
        type: string
        description: Human-readable purpose; injected into the system prompt.
      - name: schema
        type: object
        description: JSON Schema for the tool's parameters.
      - name: requiresConsent
        type: boolean
        description: Whether the user must approve this `Tool`'s invocation before it executes. The `Orchestrator` displays a consent prompt before calling the handler. Distinct from `SafePath` validation which is performed by the `SecurityManager` on path-accessing tools.
    invariants:
      - id: tool-unique-name
        statement: "Each `Tool` has a unique name."

  MCPServer:
    definition: >
      An external Model Context Protocol (MCP) server providing dynamic tool
      capabilities to the agent over Streamable HTTP.
    relationships:
      - entity: Tool
        cardinality: "1:n"
        ownership: owned
        note: Tools discovered from this MCP server.
    attributes:
      - name: name
        type: string
        description: The unique server identifier (map key in Config.MCPServers).
      - name: url
        type: string
        description: Base URL of the remote MCP server endpoint.
      - name: auth
        type: string
        description: "Authentication mode: auto, gh, bearer, basic, or none."
      - name: username
        type: string
        description: "Username for Basic authentication (AUTH: basic); sent as the Basic user with TOKEN as the password."
      - name: requiresConsent
        type: boolean
        description: Whether tools from this server require user approval before execution.
      - name: serial
        type: boolean
        description: Whether tools from this server must execute sequentially.
      - name: timeout
        type: integer
        description: Per-tool-call execution timeout in seconds.
    invariants:
      - id: mcp-server-key-format
        statement: "MCP server keys must be 1 to 24 characters matching `^[a-z0-9-]+$`."
      - id: mcp-token-not-logged
        statement: "Credentials and derived Authorization headers for `MCPServer`s must never be logged or serialized by the MCP credential plumbing (config validation, DI factory, client transport)."
      - id: mcp-readonly-defaults
        statement: "An `MCPServer` targeting a read-only endpoint defaults to `requiresConsent: false` and concurrent execution (`serial: false`)."

  Skill:
    definition: >
      A block of guidance injected into the system prompt when the task is
      relevant. `Skill`s are stored as SKILL.md files (YAML frontmatter +
      Markdown body) following the skills.sh format. They come from two
      sources: local `docs/skills/` (curated by the Dobby template, e.g.
      golang-patterns, golang-testing) and the skills.sh ecosystem
      `.skills/` (installed on demand via `install_skill`). Injection is
      triggered by keyword matching against the user prompt via
      the skill selector, and injected into `Context` by the skill injector.
    attributes:
      - name: name
        type: string
        description: Unique skill identifier from YAML frontmatter.
      - name: description
        type: string
        description: Human-readable summary from YAML frontmatter; used in `list_skills` output.
      - name: content
        type: string
        description: The Markdown body injected into the context.
      - name: tokenCount
        type: integer
        derived: true
        derivation: "Heuristic: len(content) / 4."
      - name: source
        type: string
        description: '"local" for docs/skills/, "skills.sh" for .skills/. Used by remove_skill to gate deletion.'
    invariants:
      - id: skill-unique-name
        statement: "Each `Skill` has a unique name."
      - id: skill-remove-source-gate
        statement: "Only `Skill`s with `source: skills.sh` can be removed by `remove_skill`; local skills are protected."

  Task:
    definition: >
      A unit of work tracked by the system for the user. `Task`s form a
      simple to-do list: each has a description, a status (pending or
      completed), and a creation timestamp. Owned by `Session` — tasks are
      persisted alongside the session's `History`.
    attributes:
      - name: id
        type: integer
        description: Monotonically increasing unique identifier.
      - name: content
        type: string
        description: Human-readable description of the task.
      - name: status
        type: string
        description: 'Current state: "pending" or "completed".'
      - name: createdAt
        type: timestamp
    actions:
      - name: add
        actor: Orchestrator
        description: Create a new `Task` with status "pending".
      - name: update
        actor: Orchestrator
        description: Modify the content or status of an existing `Task`.
      - name: delete
        actor: Orchestrator
        description: Remove a `Task` from the list.
      - name: list
        actor: Orchestrator
        description: Retrieve `Task`s, optionally filtered by status.
    invariants:
      - id: task-non-empty-content
        statement: "A `Task`'s `content` must not be empty."

  SafePath:
    definition: >
      A directory or file boundary authorized for `Tool` operations. Before a
      `Tool` reads or writes outside allowed boundaries, the `SecurityManager`
      prompts the user via the `UserInteractor` for confirmation. Once
      authorized, the path persists across `Session`s.
    attributes:
      - name: path
        type: string
        description: The absolute or relative path.
      - name: mode
        type: string
        description: 'Either "read" (read-only) or "readwrite" (full access).'
      - name: authorizedAt
        type: timestamp
    invariants:
      - id: safepath-absolute
        statement: "Paths are stored in canonical absolute form."

  History:
    definition: >
      The persisted record of a `Session`'s `Turn`s, stored as an append-only
      JSON Lines file (`history.jsonl`) with an incremental patch system for
      metadata updates (e.g. pinning). Older `Turn`s that have been summarised
      are moved to a separate archive file (`history.archive.jsonl`) to keep
      the in-memory working set bounded. The archive supports O(1) lazy
      navigation via byte-offset indexing (`file.Seek`) — it is never loaded
      fully into memory. Patches are merged into clean base records during
      compaction (triggered by `save`, `rollback`, `edit`, and per-turn pipeline rewrites). Separate from the
      in-memory `Session` state.
    attributes:
      - name: turns
        type: "[]Turn"
        description: Ordered list of persisted `Turn`s stored as individual JSONL lines.
      - name: pinnedTurnIDs
        type: "[]string"
        description: Stable UUIDs of `Turn`s protected from summarisation/pruning, persisted as `_patch` metadata lines.
    actions:
      - name: append
        description: Append a `Turn` as a new JSONL line — O(1) disk operation.
      - name: save
        description: Atomic full rewrite of the active file, merging all outstanding patches.
      - name: archive
        description: Move summarised `Turn`s to `history.archive.jsonl` and remove them from the active file.
      - name: compact
        description: Merge outstanding `_patch` lines into clean base records.
      - name: rollback
        description: Remove the last N `Turn`s from the active file and persist.
    invariants:
      - id: history-persisted-after-turn
        statement: "Every completed `Turn` is persisted before the next `Turn` begins."

scenarios:
  - name: Basic question-answer turn
    description: >
      A user asks a question that requires no `Tool`s. The `Orchestrator`
      assembles the `Context`, sends it to the selected `Provider`, receives a
      `Thought` (text), and renders the response.
    actors: [Orchestrator, Chatter, Context, Provider, Session, Task]
    steps:
      - User submits a prompt via CLI.
      - "`Orchestrator` creates a `Turn` in the current `Session`."
      - "`Orchestrator` assembles the `Context`: system prompt + recent `Turn`s + user prompt."
      - "`Orchestrator` sends the `Context` to the `Provider` via `Chatter`."
      - "`Provider` returns a text `Thought` via `Chatter`."
      - "`Orchestrator` renders the response and persists the `Turn` to `History`."
      - Cost and token metrics are updated on the `Session`.
      - "Any pending `Task`s are tracked and can be listed by the user."
    invariants_touched: [session-max-turns, history-persisted-after-turn, context-within-budget, turn-belongs-to-one-session]

  - name: Cost auditing per turn
    description: >
      After every `Turn` completes, the `Orchestrator` computes its USD cost
      using the token counts and the active `Provider`'s `Pricing` rates, then
      accumulates it on the `Session`. This ensures deterministic, real-time
      budget visibility — no hidden expenses.
    actors: [Orchestrator, Turn, Pricing, Session]
    steps:
      - "A `Turn` completes with known token counts (input, output, thinking)."
      - "`Orchestrator` looks up the active `Provider`'s model in `Pricing`."
      - "Cost is computed: (input × rate) + (output × rate) + (thinking × rate)."
      - "The `Turn`'s `cost` attribute is set."
      - "The session cost tracker accumulates the `Turn`'s cost; `Session.totalCost` reflects it."
    invariants_touched: [deterministic-cost-audit, pricing-unique-model]

  - name: Skill injection into context
    description: >
      When the user's prompt matches a `Skill`'s keywords, the
      `Orchestrator` injects that `Skill`'s guidance into the `Context` system
      prompt. `Skill`s are loaded from two sources: local `docs/skills/`
      (always available) and `.skills/` (installed on demand from skills.sh).
      Both are merged by a composite repository before keyword matching.
    actors: [Orchestrator, Skill, Context, Provider, Session]
    steps:
      - "User submits a prompt containing keywords that match a `Skill`."
      - "`Orchestrator` scans all registered `Skill`s from both local and skills.sh sources."
      - "The matched `Skill`'s content is injected into the `Context` system prompt."
      - "`Provider` receives the augmented `Context` and responds accordingly."
      - "The `Turn` is persisted as normal."
      - "If a skill from the skills.sh ecosystem was installed mid-session, it becomes available on the next `Turn`."
    invariants_touched: [skill-unique-name, context-within-budget, skill-remove-source-gate]

  - name: Tool-augmented turn
    description: >
      The LLM requests a `Tool` call. The `Orchestrator` dispatches it, feeds the
      result back to the `Provider`, and continues until the LLM emits a final
      text response.
    actors: [Orchestrator, Provider, Tool, ToolCall, Session]
    steps:
      - "`Provider` returns a `Thought` requesting a `Tool` execution."
      - "`Orchestrator` validates the `Tool` name and arguments."
      - "If the `Tool` requires consent, the `Orchestrator` prompts the user for approval."
      - "If the `Tool` accesses paths, the `SecurityManager` validates them against the `SafePath` registry."
      - "`Orchestrator` executes the `Tool` (possibly concurrently with others), bounded by `Config.maxToolTurns` iterations."
      - "The `Tool` result is fed back to the `Provider`."
      - "The cycle repeats until `Provider` emits a final text `Thought`."
      - "The `Turn` (with all `ToolCall`s) is persisted to `History`."
    invariants_touched: [tool-timeout, tool-unique-name, turn-max-tool-iterations]

  - name: Hallucination loop detection
    description: >
      The `Orchestrator` detects when the LLM is stuck in a loop via two
      mechanisms: (1) response hashing — SHA-256 of the sanitized response is
      compared against a sliding window of recent hashes; any duplicate
      triggers the break, and (2) tool-call counting — identical
      `FunctionCall` name+arguments pairs that repeat beyond the threshold
      are detected immediately. When either triggers, synthetic feedback is
      injected to break the cycle.
    actors: [Orchestrator, Session, Turn]
    steps:
      - "`Orchestrator` computes SHA-256 of the sanitized final response (excluding mutable fields like ID) for a `Turn`."
      - "The hash is compared against a sliding window of recent response hashes. Any duplicate in the window triggers detection."
      - "In parallel, identical function-call name+arguments pairs are counted per-`Turn`. Repeating a tool call beyond the threshold triggers detection immediately."
      - "When a loop is detected, the `Orchestrator` publishes a warning, persists the repeating response, injects synthetic corrective feedback, and signals the `Turn` to complete."
    invariants_touched: [session-max-turns]

  - name: Context overflow and summarisation
    description: >
      When the assembled `Context` approaches the model's token budget, the
      `Orchestrator` summarises older `Turn`s while preserving pinned ones
      verbatim — keeping the `Context` within the `Pricing.contextWindow` limit
      without losing critical information.
    actors: [Orchestrator, Context, History, Session]
    steps:
      - "`Orchestrator` assembles the `Context` and checks `tokenCount`."
      - "`tokenCount` exceeds the model's `Pricing.contextWindow`."
      - "`Orchestrator` identifies the oldest non-pinned `Turn`s."
      - "Those `Turn`s are summarised; pinned `Turn`s are preserved verbatim."
      - "The summarised content replaces the original `Turn`s in `Context`."
      - "`Context.tokenCount` is recomputed and now fits within budget."
    invariants_touched:
      [context-within-budget, context-pinned-preserved, history-persisted-after-turn]

  - name: Provider error classification and failover
    description: >
      When the selected `Provider` returns an error, the `Orchestrator`
      classifies it using the `LLMError` taxonomy: rate limits and server errors
      may retry or fail over; auth failures and context overflows are terminal
      for that `Provider` and handled differently.
    actors: [Orchestrator, Provider, Config, Pricing]
    steps:
      - "`Provider` returns an error response."
      - "`Orchestrator` classifies the error: `rate_limited`, `server_error`, `timeout`, `auth_failure`, or `context_overflow`."
      - "For `rate_limited`: `Orchestrator` applies backoff and retries the same `Provider`."
      - "For `server_error` or `timeout`: the `Orchestrator` retries the same `Provider` with backoff. Provider-level failover to an alternate is handled by the gateway layer on subsequent requests, not by the per-turn recovery step."
      - "For `auth_failure`: `Orchestrator` surfaces the error immediately — no retry."
      - "For `context_overflow`: `Orchestrator` triggers `Context` summarisation and retries."
      - The user is informed of the resolution path taken.
    invariants_touched: [config-valid-provider, context-within-budget]

  - name: Session undo and retry
    description: >
      The user undoes the last N `Turn`s via the `--back-n` CLI flag.
      If a `--prompt` is also provided, a fresh chat session begins after
      the rollback, effectively retrying with the rolled-back history.
    actors: [Orchestrator, Session, History]
    steps:
      - "User invokes undo via the `--back-n` CLI flag."
      - "`Orchestrator` rolls back the `History` manager, removing the last N `Turn`s from persistent storage."
      - "`History` is synced to disk to reflect the rollback."
      - "If a `--prompt` is also provided on the same invocation, a fresh `Session` begins after rollback, sending the new prompt to the `Provider` with the rolled-back history as context."
    invariants_touched: [history-persisted-after-turn]

  - name: Path authorization
    description: >
      A `Tool` attempts to access a path outside the project boundary. The
      `SecurityManager` prompts the user for confirmation before allowing
      access.
    actors: [SecurityManager, UserInteractor, SafePath, Tool]
    steps:
      - "`Tool` requests access to a path."
      - "`SecurityManager` checks if the path is within any registered `SafePath`."
      - >
        If not, and `bypassConfirmation` is false, the `UserInteractor` prompts
        the user.
      - >
        If the user approves, the path is registered as a `SafePath` and the
        `Tool` proceeds.
      - "If the user denies, the `Tool` returns an error."
      - "If `bypassConfirmation` is true, the check is silently skipped."
    invariants_touched: [safepath-absolute, bypass-suppresses-prompts]

  - name: Concurrent tool execution
    description: >
      The LLM requests multiple independent `Tool` calls in a single response.
      The `Orchestrator` dispatches them concurrently (up to
      `Config.maxConcurrentTools`), collects results as they complete, and
      feeds the aggregated results back to the `Provider` in one batch.
    actors: [Orchestrator, Provider, Tool, ToolCall, Session]
    steps:
      - "`Provider` returns a `Thought` requesting three independent `Tool` executions."
      - "`Orchestrator` validates each `Tool` name and arguments."
      - "`Orchestrator` dispatches all three `ToolCall`s concurrently, respecting `Config.maxConcurrentTools`."
      - "Each `ToolCall` executes independently; one takes longer but stays within `Config.toolTimeout`."
      - "Results are collected and fed back to the `Provider` in a single response."
      - "`Provider` integrates the results and emits a final text `Thought`."
      - "The `Turn` (with all `ToolCall`s, each carrying its own `duration` and `status`) is persisted to `History`."
    invariants_touched: [tool-timeout, tool-unique-name, tool-max-concurrent, turn-max-tool-iterations]

  - name: Session crash recovery
    description: >
      A `Turn` is in progress when the process crashes. On restart, the
      `Orchestrator` recovers the `Session` from the append-only JSONL
      `History`. Because `History` appends each `Turn` atomically as a
      single line only after the `Turn` completes, the interrupted `Turn`
      was never written — all previously committed `Turn`s are intact.
      The `Session` resumes cleanly without data loss.
    actors: [Orchestrator, History, Session, Turn]
    steps:
      - "A `Session` has three completed `Turn`s persisted to `History`."
      - "The fourth `Turn` begins — the `Provider` is called but the process crashes before the response arrives."
      - "On restart, the `Orchestrator` loads the `History` file from disk."
      - "The `History` contains exactly three `Turn`s — the interrupted fourth was never appended."
      - "The `Orchestrator` reconstructs the `Session` from those three `Turn`s."
      - "The user is informed that the previous session was recovered."
      - "The next user prompt begins a fresh fourth `Turn`."
    invariants_touched: [history-persisted-after-turn, turn-belongs-to-one-session]

  - name: Turn pinning and protection
    description: >
      The user explicitly pins specific `Turn`s to protect them from
      summarisation. Later, when the `Context` overflows the model's token
      budget, the `Orchestrator` summarises older unpinned `Turn`s while
      preserving the pinned `Turn`s verbatim — ensuring critical decisions
      and findings survive context compression intact.
    actors: [Orchestrator, Context, History, Session, Turn]
    steps:
      - "A long `Session` accumulates 20 `Turn`s; the user pins `Turn` 5 (an architectural decision) and `Turn` 15 (a key test result) via `manage_history`."
      - "The pinned turn IDs are persisted as `_patch` metadata lines in `History`."
      - "On `Turn` 21, the `Orchestrator` assembles the `Context` and finds `tokenCount` exceeds `Pricing.contextWindow`."
      - "The `Orchestrator` identifies the oldest non-pinned `Turn`s for summarisation."
      - "`Turn`s 5 and 15 are skipped — their content remains verbatim in `Context`."
      - "Older unpinned `Turn`s are compressed into summarised blocks."
      - "`Context.tokenCount` is recomputed and now fits within budget."
      - "The `Provider` receives the compressed `Context` where the pinned `Turn`s are still exact."
    invariants_touched: [context-within-budget, context-pinned-preserved, history-persisted-after-turn]

  - name: Fresh session with global state preservation
    description: >
      The user starts a new `Session` via `--new`. The `Orchestrator` archives
      the old `Session`'s `History` (all `Turn`s are moved to the archive file)
      but preserves global state: `SafePath` registrations and `Task`s survive
      across sessions because they are stored under `TellMeHome`, not inside the
      `Session`-scoped `History` file. The new `Session` begins with a clean
      conversation but retains the user's authorized paths and to-do list.
    actors: [Orchestrator, Session, History, SafePath, Task]
    steps:
      - "User has an active `Session` with 15 `Turn`s, 3 registered `SafePath`s, and 2 pending `Task`s."
      - "User invokes `tell-me-go --new \"Start fresh\"`."
      - "The `Orchestrator` archives the old `Session`: its `History` is moved to the archive file."
      - "Global state (`SafePath`s and `Task`s) is preserved — they outlive the old `Session`."
      - "A new `Session` is created with a fresh conversation context."
      - "The new `Session`'s `History` starts with 0 `Turn`s."
      - "The 3 `SafePath`s are still registered and active — `Tool`s respect them immediately."
      - "The 2 `Task`s are still pending and visible to the user."
      - "The user prompt is sent as the first `Turn` of the new `Session`."
    invariants_touched: [safepath-absolute, task-non-empty-content, history-persisted-after-turn]

  - name: Config hot-reload mid-session
    description: >
      The user edits the YAML `Config` file (e.g. changing `MAX_TURNS`,
      `MAX_HISTORY_TURNS`, or the context window) while a `Turn` is in
      progress. The `Orchestrator` detects the file change at the next phase
      transition (between inference and tool execution), re-reads the changed
      limits, and atomically applies them — without restarting the `Session`.
      Switching the active `Provider` requires a new session; the hot-reload
      path refreshes only operational limits, not provider identity.
    actors: [Orchestrator, Config, Context, Provider, Session]
    steps:
      - "A `Session` is mid-`Turn`: the `Provider` has returned a response with tool calls."
      - "While the LLM was responding, the user edits `butler.yaml` to raise `MAX_TURNS` (the `Config.maxToolTurns` limit) from 20 to 50."
      - "The `Orchestrator`'s `configRefreshHook` fires on the `Inference → Execution` phase transition."
      - "The config watcher re-reads the file and extracts updated limits (`maxHistoryTokens`, `maxToolTurns`, `maxHistoryTurns`, `contextWindow`)."
      - "New limits are atomically applied: `Context` token budget, max tool turns, and concurrency are updated."
      - "Tool execution proceeds with the updated limits."
      - "`SELECTED_PROVIDER` is not refreshed — switching providers requires a new `Session`."
    invariants_touched: [context-within-budget, turn-max-tool-iterations]

  - name: Retry last turn
    description: >
      The user invokes `--retry` after an unsatisfactory response. Before the
      session loop begins, the `ChatService` locates the last user message in
      `History`, prompts the user for confirmation, rolls back exactly one
      `Turn`, and rewrites the command parameters so the `Orchestrator`
      resends the original prompt as a fresh `Turn`. The user does not need
      to re-type or even know the original prompt — it is recovered
      automatically from `History`.
    actors: [Orchestrator, Session, History, Turn]
    steps:
      - "The user receives a model response they are unhappy with."
      - "User invokes `tell-me-go --retry`."
      - "Before the session loop starts, ChatService calls `History.GetLastUserMessage`, which scans backward to find the most recent user-role message."
      - "The method returns both the original prompt text and the number of `Turn`s to roll back (typically 1 for a standard user→model pair)."
      - "The user is prompted: `Retry? [y/N]`. If declined, the operation aborts with no changes."
      - "On confirmation, ChatService rewrites the command's prompt and BackN fields and the `Orchestrator` rolls back `History` by the computed number of `Turn`s."
      - "`History` is synced to disk to reflect the rollback."
      - "The `Orchestrator` begins a fresh `Session` loop with the recovered prompt."
      - "The new `Turn` begins with the rolled-back `History` as context."
    invariants_touched: [history-persisted-after-turn, turn-belongs-to-one-session]

  - name: MCP tool discovery and execution
    description: >
      The agent initializes external tools from configured MCP servers over
      Streamable HTTP, normalizes their schemas, and executes tool calls with
      in-turn error recovery.
    actors: [Orchestrator, Config, MCPServer, Tool, ToolCall, Session]
    steps:
      - "`Orchestrator` initializes `Session` with configured `MCPServer`s from `Config`."
      - "Dynamic tool discovery queries `MCPServer` for available tools."
      - "Tools are normalized, namespaced, and registered as `Tool` entities with appropriate consent and serial flags."
      - "Unsupported schema combinators gracefully degrade to freeform arguments."
      - "LLM requests an MCP tool execution via `ToolCall`."
      - "`ToolCall` delegates execution to the remote `MCPServer` over Streamable HTTP."
      - "Non-terminal MCP tool errors (isError: true) return error text with nil Go error for in-turn LLM recovery."
    invariants_touched: [mcp-server-key-format, mcp-readonly-defaults, tool-timeout, tool-unique-name]

invariants:
  - id: deterministic-cost-audit
    statement: >
      Every `Turn`'s cost is computed from token counts and the `Provider`'s
      pricing model before the next `Turn` begins, and accumulated on the
      session cost tracker (surfaced as `Session.totalCost`).
