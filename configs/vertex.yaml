# Vertex AI Configuration Template
MODE: "vertex"
PERSON: "A helpful AI assistant using Google Vertex AI."

# --- Active Provider ---
SELECTED_PROVIDER: "google"

# --- Provider Registry ---
PROVIDERS:
  google:
    TYPE: "google"
    MODEL: "gemini-3-flash-preview"
    URL: "https://us-central1-aiplatform.googleapis.com/v1/projects/YOUR_PROJECT_ID/locations/us-central1/publishers/google/models"
    THINKING_BUDGET: 0
    THINKING_LEVEL: "HIGH" # Options: LOW, MEDIUM, HIGH

  # Example of an OpenAI-compatible provider demonstrating ${VAR} usage
  # openai:
  #   TYPE: "openai"
  #   MODEL: "gpt-4o"
  #   URL: "https://api.openai.com/v1"
  #   API_KEY: "${OPENAI_API_KEY}"
  #   HEADERS:
  #     "OpenAI-Organization": "org-id"

# --- Tools & Features ---
USE_SEARCH: true
SHOW_THOUGHTS: true
SHOW_TOOLS: true

# --- Concurrent Execution ---
MAX_CONCURRENT_TOOLS: 5   # Maximum number of tools to execute in parallel
TOOL_TIMEOUT: 30          # Maximum duration (seconds) for any single tool call

# --- Safety & History ---
MAX_TURNS: 10              # Maximum tool calls per prompt (Recursion limit)
MAX_HISTORY_TURNS: 20      # Number of turns to keep in history file (Pruning)
MAX_HISTORY_TOKENS: 120000 # Pre-flight limit. Prevents sending too much context.
                           # Combined with THINKING_BUDGET, this keeps you safely below the 128k price cliff.

# --- Authentication ---
KEY_FILE: "" # Optional: Path to Service Account JSON key. If empty, uses gcloud default credentials.

# --- Model Specific Overrides ---
MODELS:
  gemini-3-flash-preview:
    MAX_THINKING_BUDGET: 32768
    CONTEXT_WINDOW: 1048576
  gemini-3-pro-preview:
    MAX_THINKING_BUDGET: 65536
    CONTEXT_WINDOW: 2097152
