# Multi-Provider AI Coder Configuration
MODE: "coder"
PERSON: "You are the primary Software Development Agent and the ONLY role with WRITE access to files. Your mission is to implement features and fixes based on instructions from the Architect, Reviewer, Tester, and Writer. Follow the SOP: 1. Analyze: Understand requirements and check for edge cases first. 2. Plan: Propose a step-by-step implementation plan before modifying files. 3. TDD: Write failing tests before implementation; aim for 80%+ coverage. 4. Standards: Enforce immutability, modular architecture, and security (no hardcoded secrets). 5. Review: Self-verify changes against the success criteria and incorporate feedback from the Reviewer/Tester. Respond concisely and accurately in English."

# --- Active Provider ---
SELECTED_PROVIDER: "google"

# --- Provider Registry ---
PROVIDERS:
  vertex-deepseek:
    TYPE: "deepseek"
    MODEL: "deepseek-ai/deepseek-v3.2-maas"
    URL: "https://aiplatform.googleapis.com/v1beta1/projects/${GOOGLE_PROJECT_ID}/locations/global/endpoints/openapi"
    API_KEY: "${GOOGLE_APPLICATION_CREDENTIALS}"
    HEADERS:
      X-Vertex-AI-LLM-Request-Type: "shared"
      X-Vertex-AI-LLM-Shared-Request-Type: "priority"
  vertex-claude:
    TYPE: "anthropic"
    MODEL: "claude-opus-4-6"
    URL: "https://aiplatform.googleapis.com/v1/projects/${GOOGLE_PROJECT_ID}/locations/global/publishers/anthropic/models"
    API_KEY: "${GOOGLE_APPLICATION_CREDENTIALS}"
    THINKING_BUDGET: 32768
    HEADERS:
      X-Vertex-AI-LLM-Request-Type: "shared"
      X-Vertex-AI-LLM-Shared-Request-Type: "priority"
  google:
    TYPE: "gemini"
    MODEL: "gemini-3-flash-preview"
    URL: 'https://aiplatform.googleapis.com/v1/projects/${GOOGLE_PROJECT_ID}/locations/global/publishers/google/models'
    API_KEY: '${GOOGLE_APPLICATION_CREDENTIALS}' # Optional - fall back to gcloud auth
    THINKING_BUDGET: 32768
    THINKING_LEVEL: "HIGH"
    HEADERS:
      X-Vertex-AI-LLM-Request-Type: "shared"
      X-Vertex-AI-LLM-Shared-Request-Type: "priority"
  openai:
    TYPE: "openai"
    MODEL: "gpt-5.2"
    URL: "https://api.openai.com/v1"
    API_KEY: '${OPENAI_API_KEY}'
    HEADERS:
      reasoning_effort: "high"
  deepseek:
    TYPE: "deepseek"
    MODEL: "deepseek-reasoner"
    URL: "https://api.deepseek.com"
    API_KEY: '${DEEPSEEK_API_KEY}'
  claude:
    TYPE: "anthropic"
    MODEL: "claude-opus-4-6"
    URL: "https://api.anthropic.com/v1"
    API_KEY: '${ANTHROPIC_API_KEY}'
    THINKING_BUDGET: 32768

# --- Tools & Features ---
USE_SEARCH: false
SHOW_THOUGHTS: false
SHOW_TOOLS: true

# --- Concurrent Execution ---
MAX_CONCURRENT_TOOLS: 5
TOOL_TIMEOUT: 300

# --- Safety & History ---
MAX_TURNS: 500
# Reserves OUTPUT_BUDGET (32768, from google.THINKING_BUDGET) + safety_margin (10000) below CONTEXT_WINDOW (200000).
# Recompute if SELECTED_PROVIDER changes to one with a smaller window (e.g. direct deepseek = 128000).
MAX_HISTORY_TOKENS: 157000

# Model's hardcoded physical limits
MODELS:
  "gemini-3-flash-preview":
    CONTEXT_WINDOW: 200000
  "gemini-3.1-pro-preview":
    CONTEXT_WINDOW: 200000
  "deepseek-ai/deepseek-v3.2-maas":
    CONTEXT_WINDOW: 163840
    PRICING:                                                              
      HIT: 0.135
      MISS: 1.35
      COMP: 5.40
      THINKING: 5.40
  "claude-opus-4-6":
    CONTEXT_WINDOW: 200000
    PRICING:                                                              
      HIT: 0.50
      MISS: 5.00
      COMP: 25.00
      THINKING: 25.00
