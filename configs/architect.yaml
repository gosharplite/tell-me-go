# Multi-Provider AI Architect Configuration
MODE: "architect"
PERSON: "You are a Principal Software Architect (Read-Only) specializing in system design, scalability, and maintainability. You do not modify files; instead, you provide instructions to the Coder. Follow a strict Architecture SOP: 1. Analyze: Map component dependencies and interface boundaries; identify 'God Objects' and circular references. 2. Modularity: Enforce Separation of Concerns (Service vs. Transport), Dependency Injection, and Hexagonal/Clean Architecture layers. 3. Scalability: Flag synchronous blocking in hot paths, unscalable state management, and database bottlenecks (N+1 queries). 4. Consistency: Verify adherence to established patterns (Repository, CQRS) and demand Architecture Decision Records (ADRs) for major trade-offs. 5. Feedback: Categorize findings by Impact ([ARCHITECTURAL BLOCKER], [TECHNICAL DEBT], [REFACTOR]) with clear 'Current vs. Scalable' design examples. Respond concisely and accurately in English."

SELECTED_PROVIDER: "deepseek-flash"

PROVIDERS:
  deepseek-flash:
    TYPE: "deepseek"
    MODEL: "deepseek-v4-flash"
    URL: "https://api.deepseek.com"
    API_KEY: "${DEEPSEEK_API_KEY}"
    MAX_TOKENS: 32768
  deepseek-pro:
    TYPE: "deepseek"
    MODEL: "deepseek-v4-pro"
    URL: "https://api.deepseek.com"
    API_KEY: "${DEEPSEEK_API_KEY}"
    MAX_TOKENS: 32768
  vertex-deepseek:
    TYPE: "deepseek"
    MODEL: "deepseek-ai/deepseek-v3.2-maas"
    URL: "https://aiplatform.googleapis.com/v1beta1/projects/${GOOGLE_PROJECT_ID}/locations/global/endpoints/openapi"
    API_KEY: "${GOOGLE_APPLICATION_CREDENTIALS}"
    HEADERS:
      X-Vertex-AI-LLM-Request-Type: "shared"                              
      X-Vertex-AI-LLM-Shared-Request-Type: "priority"                     
  vertex-flash:
    TYPE: "gemini"
    MODEL: "gemini-3-flash-preview"
    URL: "https://aiplatform.googleapis.com/v1/projects/${GOOGLE_PROJECT_ID}/locations/global/publishers/google/models"
    API_KEY: "${GOOGLE_APPLICATION_CREDENTIALS}"
    THINKING_BUDGET: 32768
    THINKING_LEVEL: "HIGH"
    MAX_TOKENS: 40960
    HEADERS:
      X-Vertex-AI-LLM-Request-Type: "shared"                              
      X-Vertex-AI-LLM-Shared-Request-Type: "priority"                     
  vertex-pro:
    TYPE: "gemini"
    MODEL: "gemini-3.1-pro-preview"
    URL: "https://aiplatform.googleapis.com/v1/projects/${GOOGLE_PROJECT_ID}/locations/global/publishers/google/models"
    API_KEY: "${GOOGLE_APPLICATION_CREDENTIALS}"
    THINKING_BUDGET: 32768
    THINKING_LEVEL: "HIGH"
    MAX_TOKENS: 40960
  vertex-claude:
    TYPE: "anthropic"
    MODEL: "claude-opus-4-7"
    URL: "https://aiplatform.googleapis.com/v1/projects/${GOOGLE_PROJECT_ID}/locations/global/publishers/anthropic/models"
    API_KEY: "${GOOGLE_APPLICATION_CREDENTIALS}"
    THINKING_BUDGET: 32768 
  openai:
    TYPE: "openai"
    MODEL: "gpt-5.5"
    URL: "https://api.openai.com/v1"
    API_KEY: "${OPENAI_API_KEY}"
    HEADERS:
      reasoning_effort: "high"
  claude:
    TYPE: "anthropic"
    MODEL: "claude-opus-4-7"
    URL: "https://api.anthropic.com/v1"
    API_KEY: "${ANTHROPIC_API_KEY}"
    THINKING_BUDGET: 32768

# --- Tools & Features ---
USE_SEARCH: false
SHOW_THOUGHTS: false
SHOW_TOOLS: true

# --- Global Timeouts & Streaming ---
HTTP_TIMEOUT: 300

# --- Concurrent Execution ---
MAX_CONCURRENT_TOOLS: 5
TOOL_TIMEOUT: 300

# --- Safety & History ---
MAX_TURNS: 1000
MAX_HISTORY_TOKENS: 1000000

